<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Song Request</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      background: #101114; color: white;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 440px; margin: auto; }
    .card {
      background: #1c1d22; padding: 22px;
      border-radius: 18px; border: 1px solid #34353c;
    }
    h1 { font-size: 27px; }
    p { color: #b9bac3; line-height: 1.5; }
    label { display: block; margin: 18px 0 8px; }
    input, textarea, button {
      width: 100%; padding: 13px; border-radius: 10px;
      font-size: 16px;
    }
    input, textarea {
      background: #111216; border: 1px solid #444650;
      color: white;
    }
    button {
      margin-top: 20px; border: 0;
      background: #b6f36b; color: #171a10;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      display: none; margin-top: 16px; padding: 14px;
      border-radius: 10px; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .success { background: #293820; color: #e0ffc6; }
    .error { background: #482727; color: #ffdada; }
    .note { font-size: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>🎵 Request a Song</h1>
      <p>Minta lagu untuk dibawakan oleh musisi malam ini!</p>

      <form id="requestForm">
        <label for="nickname">Nama panggilan</label>
        <input id="nickname" maxlength="40"
          placeholder="Contoh: Andi" required>

        <label for="song">Judul lagu dan penyanyi</label>
        <input id="song" maxlength="120"
          placeholder="Contoh: Separuh Aku - NOAH" required>

        <label for="message">Pesan untuk musisi (opsional)</label>
        <textarea id="message" maxlength="200" rows="3"
          placeholder="Semangat, Kak!"></textarea>

        <button id="submitBtn" type="submit">
          Kirim Permintaan Lagu
        </button>
      </form>

      <div id="result" role="status" aria-live="polite"></div>
      <p class="note">
        Versi uji coba. Pembayaran QRIS belum diaktifkan.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zhxtujudocgrkjcgzixu.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_qYaYXBAvjoA8bwJ92HOQTg_GJaw1EUZ";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("requestForm");
    const button = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nickname = document.getElementById("nickname").value.trim();
      const song = document.getElementById("song").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!nickname || !song) return;

      button.disabled = true;
      button.textContent = "Mengirim...";
      result.style.display = "none";

      try {
        const { error } = await client
          .from("song_requests")
          .insert({
            nickname: nickname,
            song_title: song,
            message: message
          });

        if (error) throw error;

        result.className = "success";
        result.textContent =
          "Terima kasih, " + nickname +
          "! Permintaan lagu berhasil disimpan.";
        result.style.display = "block";
        form.reset();
      } catch (error) {
        console.error("Gagal menyimpan permintaan:", error);
        result.className = "error";
        result.textContent =
          "Permintaan belum berhasil disimpan. " +
          "Periksa koneksi atau pengaturan database, lalu coba lagi.";
        result.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "Kirim Permintaan Lagu";
      }
    });
  </script>
</body>
</html>
